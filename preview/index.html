<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewals Preview</title>
<style>
/* Obsidian default theme tokens (approximate) so the plugin renders as it would in the app */
.theme-dark {
  --background-primary: #1e1e1e; --background-primary-alt: #242424; --background-secondary: #262626;
  --background-modifier-border: #363636; --background-modifier-border-hover: #444; --background-modifier-hover: rgba(255,255,255,.075);
  --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666; --text-on-accent: #fff;
  --interactive-normal: #363636; --interactive-hover: #3f3f3f;
  --interactive-accent: hsl(254, 80%, 68%); --text-accent: hsl(258, 88%, 76%);
  --color-red: #fb464c; --color-orange: #e9973f; --color-yellow: #e0de71; --color-green: #44cf6e;
  --color-cyan: #53dfdd; --color-blue: #4a9dff; --color-purple: #a882ff; --color-pink: #fa99cd;
  color-scheme: dark;
}
.theme-light {
  --background-primary: #fff; --background-primary-alt: #fafafa; --background-secondary: #f6f6f6;
  --background-modifier-border: #e0e0e0; --background-modifier-border-hover: #d4d4d4; --background-modifier-hover: rgba(0,0,0,.05);
  --text-normal: #222; --text-muted: #5c5c5c; --text-faint: #ababab; --text-on-accent: #fff;
  --interactive-normal: #fff; --interactive-hover: #f2f2f2;
  --interactive-accent: hsl(254, 80%, 60%); --text-accent: hsl(258, 70%, 52%);
  --color-red: #e93147; --color-orange: #ec7500; --color-yellow: #e0ac00; --color-green: #08b94e;
  --color-cyan: #00bfbc; --color-blue: #086ddd; --color-purple: #7852ee; --color-pink: #d53984;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--background-secondary); color: var(--text-normal); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; display: flex; flex-direction: column; }
/* Obsidian-like base controls */
button { font: inherit; height: 30px; padding: 4px 14px; border: 0; border-radius: 6px; background: var(--interactive-normal); color: var(--text-normal); box-shadow: 0 1px 2px rgba(0,0,0,.18), inset 0 0 0 1px var(--background-modifier-border); cursor: pointer; }
button:hover { background: var(--interactive-hover); }
button.mod-cta { background: var(--interactive-accent); color: var(--text-on-accent); box-shadow: none; }
button.mod-warning { background: var(--color-red); color: #fff; box-shadow: none; }
input, select, textarea { font: inherit; color: var(--text-normal); background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: 6px; padding: 4px 8px; height: 30px; }
textarea { height: auto; }
select.dropdown { padding-right: 24px; }
.setting-item { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-top: 1px solid var(--background-modifier-border); }
.setting-item-heading { border-top: 0; padding-top: 18px; }
.setting-item-heading .setting-item-name { font-weight: 600; }
.setting-item-info { flex: 1; }
.setting-item-description { font-size: .8em; color: var(--text-muted); }
.setting-item-control { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.modal-container { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; }
.modal-bg { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
.modal { position: relative; width: min(600px, calc(100vw - 24px)); max-height: 88vh; overflow: auto; padding: 18px 22px; border-radius: 12px; background: var(--background-primary); border: 1px solid var(--background-modifier-border); }
.modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 4px; }
.modal-close-button { position: absolute; right: 14px; top: 10px; font-size: 22px; cursor: pointer; color: var(--text-muted); }
.menu { position: fixed; z-index: 60; min-width: 200px; padding: 4px; border-radius: 8px; background: var(--background-secondary); border: 1px solid var(--background-modifier-border); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.menu-item { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: .9em; }
.menu-item:hover { background: var(--background-modifier-hover); }
.menu-separator { height: 1px; margin: 4px 0; background: var(--background-modifier-border); }
.notice-container { position: fixed; right: 16px; top: 16px; z-index: 70; display: flex; flex-direction: column; gap: 8px; }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--background-secondary); border: 1px solid var(--background-modifier-border); box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: .9em; max-width: 340px; }
/* Preview chrome */
.pv-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; font-size: 13px; background: #111; color: #ccc; border-bottom: 1px solid #333; }
.pv-bar b { color: #fff; margin-right: 6px; }
.pv-bar label { display: inline-flex; gap: 6px; align-items: center; }
.pv-bar select, .pv-bar button { height: 26px; font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; box-shadow: none; }
.pv-stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 16px; }
.pv-leaf { width: 100%; min-width: 0; height: 100%; border: 1px solid var(--background-modifier-border); border-radius: 6px; overflow: hidden; background: var(--background-primary); display: flex; flex-direction: column; transition: max-width .2s; }
.view-content { flex: 1; overflow: auto; padding: 0 16px; }
.pv-settings { max-width: 640px; margin: 0 auto; padding: 0 16px 24px; }
.pv-clean .pv-bar { display: none; }
.pv-clean .pv-stage { padding: 0; }
.pv-clean .pv-leaf { border: 0; border-radius: 0; }
.pv-note { max-width: 720px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
.prompt-input { width: 100%; margin-bottom: 8px; }
.suggestion-item { padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: .9em; }
.suggestion-item:hover { background: var(--background-modifier-hover); }
.suggestion-empty { padding: 6px 10px; color: var(--text-muted); }
/* Phone width: the .is-phone rules from Obsidian 1.15's app.css that change the plugin's layout */
.is-phone { font-size: 16px; }
:where(.is-phone) input, :where(.is-phone) select, :where(.is-phone) button { height: 44px; border: 0; background-color: var(--background-modifier-form-field, var(--background-secondary)); }
.is-phone .modal .setting-item-control button { padding: 10px; }
.is-mobile input[type="text"] { width: 100%; }
.is-phone .modal { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; border: 0; padding: 18px 16px; }
.is-phone .modal .setting-item { gap: 16px; }
.is-phone .modal .setting-item:not(.mod-toggle, .setting-item-heading) { flex-direction: column; align-items: flex-start; }
.is-phone .modal .setting-item:not(.mod-toggle, .setting-item-heading) .setting-item-control { width: 100%; }
.is-phone .modal .setting-item-control select,
.is-phone .modal .setting-item-control input,
.is-phone .modal .setting-item-control button:not(.clickable-icon) { width: 100%; margin: 0; }
</style>
</head>
<body>
<div class="pv-bar">
  <b>Renewals · preview</b>
  <label>Theme <select id="pv-theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
  <label>Accent <select id="pv-accent"><option value="">Default purple</option><option value="211 90% 54%">Blue</option><option value="152 60% 40%">Green</option><option value="20 90% 55%">Orange</option></select></label>
  <label>Pane <select id="pv-width"><option value="100%">Full</option><option value="900px">900px (sidebars open)</option><option value="600px">600px (split pane)</option><option value="390px">390px (phone)</option></select></label>
  <button id="pv-settings">Obsidian settings</button>
  <button id="pv-embed">Note embed</button>
  <button id="pv-empty">Empty state</button>
  <button id="pv-reset">Reset to data.json</button>
</div>
<div class="pv-stage"><div class="pv-leaf" id="pv-leaf"></div></div>

<script src="demo-data.js"></script>
<script src="obsidian-shim.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '../styles.css?' + Date.now();
  document.head.appendChild(css);

  // Persist preview controls between reloads
  const pref = JSON.parse(localStorage.getItem('st-preview-ui') || '{}');
  const savePref = () => localStorage.setItem('st-preview-ui', JSON.stringify(pref));
  const applyTheme = () => {
    const dark = (pref.theme || 'dark') === 'dark';
    document.documentElement.classList.toggle('theme-dark', dark);
    document.documentElement.classList.toggle('theme-light', !dark);
    const a = pref.accent;
    document.documentElement.style.setProperty('--interactive-accent', a ? `hsl(${a})` : '');
    document.documentElement.style.setProperty('--text-accent', a ? `hsl(${a})` : '');
    $('pv-leaf').style.maxWidth = pref.width || '100%';
    document.body.classList.toggle('is-mobile', pref.width === '390px');
    document.body.classList.toggle('is-phone', pref.width === '390px');
  };
  $('pv-theme').value = pref.theme || 'dark';
  $('pv-accent').value = pref.accent || '';
  $('pv-width').value = pref.width || '100%';
  ['theme', 'accent', 'width'].forEach((k) => $('pv-' + k).addEventListener('change', (e) => { pref[k] = e.target.value; savePref(); applyTheme(); }));
  applyTheme();

  $('pv-reset').onclick = () => { localStorage.removeItem('st-preview-data'); location.hash = ''; location.reload(); };
  $('pv-empty').onclick = () => { localStorage.removeItem('st-preview-data'); location.hash = 'empty'; location.reload(); };
  window.__ST_EMPTY__ = location.hash === '#empty';
  const early = new URLSearchParams(location.search);
  window.__ST_DEMO__ = early.get('demo') === '1';
  // ?clean=1 hides the preview toolbar, for screenshots
  if (early.get('clean') === '1') document.documentElement.classList.add('pv-clean');

  // Load the real plugin source
  const src = await (await fetch('../main.js?' + Date.now())).text();
  const module = { exports: {} };
  new Function('module', 'exports', 'require', src)(module, module.exports, () => window.__obsidian);
  const PluginClass = module.exports;

  const leaf = { containerEl: $('pv-leaf') };
  window.__obsidianLeaves.push(leaf);
  const plugin = new PluginClass();
  await plugin.onload();
  leaf.view = plugin._viewFactory(leaf);
  await leaf.view.onOpen();

  // URL shortcuts for capturing states: ?theme=light&tab=spend&open=add|edit
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) { pref.theme = q.get('theme'); applyTheme(); }
  if (q.get('width')) { pref.width = q.get('width'); applyTheme(); }
  // ?pause=N pauses N active records in memory only (never saved) to show HELD stubs
  if (q.get('pause')) {
    plugin.data.subscriptions.filter((s) => s.status === 'active').slice(0, +q.get('pause')).forEach((s) => (s.status = 'paused'));
    leaf.view.render();
  }
  if (q.get('filter')) { leaf.view.activeFilter = q.get('filter'); leaf.view.render(); }
  if (q.get('tab')) { leaf.view.tab = q.get('tab'); leaf.view.render(); }
  if (q.get('open') === 'add') plugin.openAddModal();
  if (q.get('open') === 'import') plugin.openImport();
  if (q.get('budget')) await plugin.update({ monthlyBudget: +q.get('budget') });
  if (q.get('remind')) plugin.remind(true);
  if (q.get('embed')) setTimeout(() => $('pv-embed').click(), 0);
  if (q.get('open') === 'edit') {
    const s = plugin.data.subscriptions.find((x) => x.isTrial) || plugin.data.subscriptions[0];
    if (s) plugin.openEditModal(s);
  }

  // A mock note rendering the ```renewals``` code block
  let note = null;
  $('pv-embed').onclick = () => {
    if (note) { note.remove(); note = null; leaf.view.contentEl.style.display = ''; $('pv-embed').textContent = 'Note embed'; return; }
    leaf.view.contentEl.style.display = 'none';
    note = $('pv-leaf').createDiv('pv-note view-content');
    note.createEl('h1', { text: 'Daily note' });
    note.createEl('p', { text: 'Bills to watch this week:' });
    const block = note.createDiv();
    plugin.codeBlocks.renewals('days: 7', block, { addChild: (c) => c.load() });
    note.createEl('p', { text: 'Rendered from a renewals code block with "days: 7".' });
    $('pv-embed').textContent = 'Back to view';
  };

  let showingSettings = false;
  $('pv-settings').onclick = () => {
    showingSettings = !showingSettings;
    $('pv-settings').textContent = showingSettings ? 'Back to view' : 'Obsidian settings';
    leaf.view.contentEl.style.display = showingSettings ? 'none' : '';
    const tab = plugin._settingTab;
    if (showingSettings) {
      tab.containerEl.className = 'pv-settings';
      $('pv-leaf').appendChild(tab.containerEl);
      tab.display();
    } else {
      tab.containerEl.remove();
    }
  };
})();
</script>
</body>
</html>
